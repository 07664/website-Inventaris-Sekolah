<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login- Peminjaman Inventaris Sekolah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-luar">
        <div class="box">
            <div class="auth-brand">
                <div class="auth-mark">INV</div>
                <div>
                    <div class="auth-title">Peminjaman Alat Inventaris</div>
                    <div class="auth-sub">SMK Darus Sa'adah</div>
                </div>
            </div>

            <div id="Pesan" class="Pesan" style="display: none;"></div>

            <form id="Form Login">
                <div class="kontrol">
                    <label for="username">Nama Pengguna</label>
                    <input type="text" id="username" autofocus required>
                </div>
                <button type="submit">Masuk</button>
            </form>

            <p class="kaki">Belum Punya Akun? <a href=register.html>Daftar disini</a></p>
            </div>
        </div>
        <script src="js/auth.js"></script>
    
</body>
</html>
